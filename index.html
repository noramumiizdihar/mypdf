<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Upload PDF puzzle (word search, murder mystery) dan conteng terus guna jari atau stylus. Disimpan dalam telefon, boleh guna offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyPDF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>MyPDF Puzzle</title>
</head>
<body>

<!-- ============ LIBRARY ============ -->
<section id="library" class="screen">
  <header class="bar">
    <h1><img src="icons/icon.svg" alt="" width="28" height="28"> <span>MyPDF<span class="wide-only"> Puzzle</span></span></h1>
    <button id="installBtn" class="btn ghost hidden" type="button">Install</button>
    <label class="btn ghost" for="imageInput">🖼️ Gambar</label>
    <input id="imageInput" type="file" accept="image/*" multiple hidden>
    <label class="btn primary" for="fileInput">+ PDF</label>
    <input id="fileInput" type="file" accept="application/pdf,.pdf,image/*" multiple hidden>
  </header>

  <main class="lib-main">
    <div id="docList" class="grid"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-icon">🧩</div>
      <h2>Belum ada puzzle</h2>
      <p>Tekan <b>+ PDF</b> atau <b>🖼️ Gambar</b> untuk tambah word search, murder mystery atau apa-apa puzzle.<br>
      Fail disimpan dalam telefon kau — boleh main offline.</p>
    </div>
  </main>

  <footer id="storageInfo" class="storage-info"></footer>
</section>

<!-- ============ VIEWER ============ -->
<section id="viewer" class="screen hidden">
  <header class="bar top">
    <button id="backBtn" class="icon-btn" type="button" title="Kembali" aria-label="Kembali">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div id="docTitle" class="doc-title"></div>
    <button id="undoBtn" class="icon-btn" type="button" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redoBtn" class="icon-btn" type="button" title="Redo" aria-label="Redo">
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="zoomOut" class="icon-btn" type="button" title="Zoom keluar" aria-label="Zoom keluar">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <button id="zoomLabel" class="zoom-label" type="button" title="Muat lebar skrin">100%</button>
    <button id="zoomIn" class="icon-btn" type="button" title="Zoom masuk" aria-label="Zoom masuk">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" type="button" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
    </button>
    <div id="menu" class="menu hidden" role="menu">
      <button type="button" data-action="export">📤 Simpan / Kongsi PDF berconteng</button>
      <button type="button" data-action="clearPage">🧽 Padam semua conteng di halaman ini</button>
      <button type="button" data-action="clearAll">🗑️ Padam semua conteng dalam PDF ini</button>
    </div>
  </header>

  <div id="pages" class="pages" data-tool="pen">
    <div id="stack" class="stack"></div>
  </div>
  <div id="pageIndicator" class="page-indicator"></div>

  <nav id="toolbar" class="toolbar">
    <div class="row tools">
      <button type="button" data-tool="hand" title="Scroll / gerak">
        <svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
        <span>Scroll</span>
      </button>
      <button type="button" data-tool="pen" title="Pen">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Pen</span>
      </button>
      <button type="button" data-tool="hl" title="Highlighter">
        <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
        <span>Highlight</span>
      </button>
      <button type="button" data-tool="line" title="Highlight garis lurus (untuk word search)">
        <svg viewBox="0 0 24 24"><path d="M5 19 19 5" stroke-width="5" opacity=".45"/><path d="M5 19 19 5"/></svg>
        <span>Garis</span>
      </button>
      <button type="button" data-tool="eraser" title="Pemadam">
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        <span>Padam</span>
      </button>
    </div>
    <div class="row opts">
      <div id="swatches" class="swatches"></div>
      <label class="size-wrap" title="Saiz">
        <span id="sizeDot" class="size-dot"></span>
        <input id="sizeInput" type="range" min="1" max="10" step="1" value="3" aria-label="Saiz">
      </label>
      <button id="stylusBtn" class="chip" type="button" aria-pressed="false" title="Bila ON: hanya stylus boleh conteng, jari untuk scroll &amp; zoom">✏️ Stylus sahaja</button>
    </div>
  </nav>
</section>

<div id="busy" class="busy hidden"><div class="spinner"></div><div id="busyText">Sedang proses…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
